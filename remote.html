<!DOCTYPE html>
<html lang="en">
<head>
<title>IR Remote Dongle</title>
<meta charset="UTF-8">
<style>
.btn-large {width: 300px; height: 200px; font-size: 42px;}
</style>
<script>
const urlParams = new URLSearchParams(window.location.search);
const ip = urlParams.get('ip');
const socket = new WebSocket(`ws://${ip}:9001`);
socket.binaryType = "arraybuffer";
socket.addEventListener('open', (event) => {
	document.getElementById('power').disabled = false;
	document.getElementById('source').disabled = false;
	document.getElementById('close').disabled = false;
});
socket.addEventListener('close', (event) => {
	document.getElementById('power').disabled = true;
	document.getElementById('source').disabled = true;
	document.getElementById('close').disabled = true;
});
socket.addEventListener('error', (event) => { alert('error'); });
function buttonClose() { socket.close(1000, "Client closing connection"); }
var rc_toggle = 0x38;
function rc6(adr, cmd) {
	const bit2 = Uint8Array.fromHex("586898A8");
	const a = Uint8Array.fromHex("5D10FE28560011223344112233446565800E");
	rc_toggle = rc_toggle ^ 0xf0;
	a[5] = rc_toggle;
	a[6] = bit2[(adr >> 6) & 3]; 
	a[7] = bit2[(adr >> 4) & 3]; 
	a[8] = bit2[(adr >> 2) & 3]; 
	a[9] = bit2[adr & 3]; 
	a[10] = bit2[(cmd >> 6) & 3]; 
	a[11] = bit2[(cmd >> 4) & 3]; 
	a[12] = bit2[(cmd >> 2) & 3]; 
	a[13] = bit2[cmd & 3]; 
	return a;
}
function keyDown(c) { socket.send(rc6(4, c)); }
function keyUp() { socket.send(new ArrayBuffer(0)); }
</script>
</head>
<body>
<p style="text-align: center;" ontouchend="keyUp()"><button id="power" class="btn-large" onpointerdown="keyDown(12)" disabled>POWER</button></p>
<p style="text-align: center;" ontouchend="keyUp()"><button id="source" class="btn-large" onpointerdown="keyDown(63)" disabled>SOURCE</button></p>
<p style="text-align: center;">
<button id="close" class="btn-large" onclick="buttonClose()" disabled>Close Connection</button>
</p>
</body>
</html>
